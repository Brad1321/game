name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install dependencies
        run: npm install
      - name: Create Android project
        run: npx cap add android
      - name: Lock to portrait
        run: sed -i 's|android:name=".MainActivity"|android:name=".MainActivity" android:screenOrientation="portrait"|' android/app/src/main/AndroidManifest.xml
      - name: Generate app icons
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#ffcb05' --iconBackgroundColorDark '#ffcb05'
      - name: Sync web assets
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pokemon-showdown-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
